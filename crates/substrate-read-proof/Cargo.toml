[package]
name = "substrate-read-proof"
description = "Verifies Substrate storage read proofs against a state root"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ODATANO/LIGHTSOUT"

[dependencies]
# sp-trie 47 is the polkadot-stable2609 release that the Midnight node runs.
sp-trie = { version = "47.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-crypto-hashing = { version = "0.1.0", default-features = false }
hash-db = { version = "0.16.0", default-features = false }
hash256-std-hasher = { version = "0.15.2", default-features = false }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[features]
default = ["std"]
std = ["sp-trie/std", "sp-core/std", "hash-db/std", "sp-crypto-hashing/std", "codec/std"]
