[package]
name = "midnight-grandpa"
description = "Follows Midnight GRANDPA finality from genesis and checks justifications"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ODATANO/LIGHTSOUT"

[dependencies]
# polkadot-stable2609 releases, which the Midnight node runs.
sp-consensus-grandpa = { version = "31.0.0", default-features = false }
sp-runtime = { version = "49.0.0", default-features = false }
finality-grandpa = { version = "0.16.3", default-features = false }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
sp-crypto-hashing = { version = "0.1.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
substrate-read-proof = { path = "../substrate-read-proof", default-features = false }

[dev-dependencies]
serde_json = "1"
sp-core = "43.0.0"
sp-runtime = "49.0.0"
sp-consensus-grandpa = "31.0.0"
codec = { package = "parity-scale-codec", version = "3.7.5" }
hex = "0.4"
ed25519-dalek = "2.2"

[features]
default = ["std"]
std = ["sp-consensus-grandpa/std", "sp-runtime/std", "sp-core/std", "finality-grandpa/std", "codec/std", "sp-crypto-hashing/std", "substrate-read-proof/std"]
