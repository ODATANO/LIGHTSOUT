[package]
name = "substrate-events-gen"
description = "Writes the System::Events type table of a live Midnight runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
frame-metadata = { version = "23.0.1", features = ["decode"] }
scale-info = { version = "2.11.6", features = ["decode"] }
codec = { package = "parity-scale-codec", version = "3.7.5" }
ureq = { version = "3.5.0", features = ["json"] }
serde_json = "1"
hex = "0.4"
