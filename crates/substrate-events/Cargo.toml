[package]
name = "substrate-events"
description = "Finds Midnight.TxApplied in a System::Events value, with the type table of each known runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ODATANO/LIGHTSOUT"
exclude = ["gen"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["decode"] }

[dev-dependencies]
# The tests derive a type table and its values from Rust types.
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive"] }
scale-info = { version = "2.11.6", features = ["derive", "decode"] }
# The decoder the tests compare the crate's own stepping with.
scale-decode = { version = "0.16.2", default-features = false }
# Lets scale-decode walk a scale-info registry.
scale-type-resolver = { version = "0.2.0", default-features = false, features = ["scale-info"] }
hex = "0.4"
sha2 = "0.10"
serde_json = "1"
